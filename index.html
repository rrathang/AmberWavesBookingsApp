<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmberWaves - Booking Confirmation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container-fluid py-4 content-wrapper">
        <header class="text-center mb-4 text-white">
            <h1 class="display-5 fw-bold brand-title">AmberWaves</h1>
            <p class="lead fw-light">Homestays and Rental</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- Main Card -->
                <div class="card glass-card shadow-lg border-0">
                    <div class="card-header bg-transparent border-0 pt-4 px-4">
                        <ul class="nav nav-pills nav-fill custom-nav" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill fw-medium" id="booking-tab"
                                    data-bs-toggle="tab" data-bs-target="#booking" type="button" role="tab"
                                    aria-selected="true">
                                    <i class="bi bi-pencil-square me-2"></i>New Booking
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill fw-medium" id="calendar-tab" data-bs-toggle="tab"
                                    data-bs-target="#calendar" type="button" role="tab" aria-selected="false">
                                    <i class="bi bi-calendar-event me-2"></i>My Calendar
                                </button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body p-4">
                        <div class="tab-content" id="myTabContent">

                            <!-- BOOKING TAB -->
                            <div class="tab-pane fade show active" id="booking" role="tabpanel">
                                <form id="bookingForm" class="needs-validation" novalidate>
                                    <div class="row g-3">

                                        <!-- Guest Name -->
                                        <div class="col-12">
                                            <label for="guestName" class="form-label custom-label">Guest Name</label>
                                            <input type="text" class="form-control custom-input" id="guestName" required
                                                placeholder="Enter guest name">
                                        </div>

                                        <!-- Dates -->
                                        <div class="col-md-6">
                                            <label for="checkInDate" class="form-label custom-label">Check-in
                                                Date</label>
                                            <input type="date" class="form-control custom-input" id="checkInDate"
                                                required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="checkOutDate" class="form-label custom-label">Check-out
                                                Date</label>
                                            <input type="date" class="form-control custom-input" id="checkOutDate"
                                                required>
                                        </div>

                                        <!-- Stay Details -->
                                        <div class="col-md-4">
                                            <label for="numPeople" class="form-label custom-label">No. of Guests</label>
                                            <input type="number" class="form-control custom-input" id="numPeople"
                                                min="1" value="1" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="villaSelect" class="form-label custom-label">Villa</label>
                                            <select class="form-select custom-input" id="villaSelect" required>
                                                <option value="" selected disabled>Select Villa</option>
                                                <option value="Azure Star">Azure Star</option>
                                                <option value="Emerald Green">Emerald Green</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="numRooms" class="form-label custom-label">Rooms</label>
                                            <input type="number" class="form-control custom-input" id="numRooms" min="1"
                                                required>
                                        </div>

                                        <!-- Times -->
                                        <div class="col-md-6">
                                            <label for="checkInTime" class="form-label custom-label">Check-in
                                                Time</label>
                                            <input type="time" class="form-control custom-input" id="checkInTime"
                                                value="14:00" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="checkOutTime" class="form-label custom-label">Check-out
                                                Time</label>
                                            <input type="time" class="form-control custom-input" id="checkOutTime"
                                                value="11:00" required>
                                        </div>

                                        <!-- Payment Details -->
                                        <div class="col-md-6">
                                            <label for="totalAmount" class="form-label custom-label">Total Amount
                                                (₹)</label>
                                            <input type="number" class="form-control custom-input" id="totalAmount"
                                                min="0" required placeholder="e.g. 20000">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="advancePaid" class="form-label custom-label">Advance Paid
                                                (₹)</label>
                                            <input type="number" class="form-control custom-input" id="advancePaid"
                                                min="0" required placeholder="e.g. 6000">
                                        </div>

                                        <!-- Turf Access -->
                                        <div class="col-12">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" id="turfAccess">
                                                <label class="form-check-label custom-label" for="turfAccess">Include
                                                    Turf Access?</label>
                                            </div>
                                        </div>

                                        <!-- Turf Schedule (Hidden by default) -->
                                        <div class="col-md-6 turf-time d-none">
                                            <label for="turfStartTime" class="form-label custom-label">Turf Start
                                                Time</label>
                                            <input type="time" class="form-control custom-input" id="turfStartTime">
                                        </div>
                                        <div class="col-md-6 turf-time d-none">
                                            <label for="turfEndTime" class="form-label custom-label">Turf End
                                                Time</label>
                                            <input type="time" class="form-control custom-input" id="turfEndTime">
                                        </div>

                                    </div>

                                    <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-end">
                                        <button type="button" class="btn btn-primary btn-lg custom-btn"
                                            id="generateBtn">
                                            <i class="bi bi-magic me-2"></i>Generate Confirmation
                                        </button>
                                    </div>
                                </form>

                                <!-- Generated Content Section -->
                                <div id="confirmationSection" class="mt-5 d-none">
                                    <hr class="border-white-50">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h4 class="text-white mb-0">Preview</h4>
                                        <button class="btn btn-success custom-btn-success" id="copyBtn">
                                            <i class="bi bi-whatsapp me-2"></i>Copy for WhatsApp
                                        </button>
                                    </div>
                                    <div class="position-relative">
                                        <textarea class="form-control custom-textarea" id="generatedOutput" rows="15"
                                            readonly></textarea>
                                        <div id="copyToast" class="toast-notification">Copied to clipboard!</div>
                                    </div>
                                </div>
                            </div>

                            <!-- CALENDAR TAB -->
                            <div class="tab-pane fade" id="calendar" role="tabpanel">
                                <div class="calendar-container">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <button class="btn btn-outline-light btn-sm" id="prevMonth"><i
                                                class="bi bi-chevron-left"></i></button>
                                        <h4 class="mb-0 text-white" id="monthDisplay">December 2024</h4>
                                        <button class="btn btn-outline-light btn-sm" id="nextMonth"><i
                                                class="bi bi-chevron-right"></i></button>
                                    </div>

                                    <div class="calendar-grid-header">
                                        <div>Sun</div>
                                        <div>Mon</div>
                                        <div>Tue</div>
                                        <div>Wed</div>
                                        <div>Thu</div>
                                        <div>Fri</div>
                                        <div>Sat</div>
                                    </div>
                                    <div class="calendar-grid" id="calendarGrid">
                                        <!-- Days injected here -->
                                    </div>

                                    <div class="mt-3 text-white-50 small">
                                        <span class="badge bg-danger rounded-circle p-1 me-1"> </span> Booked
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
